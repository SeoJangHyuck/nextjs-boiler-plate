# pnpm 설정
# pnpm 11부터 package.json의 pnpm 필드 대신 이 파일을 읽는다. (.npmrc는 인증·레지스트리 전용)

# --- 공급망 보안 ---------------------------------------------------------------

# 게시된 지 3일(4320분)이 지난 버전만 설치한다.
# 침해된 패키지는 대부분 이 기간 안에 발견되어 내려간다.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

# 이전 버전보다 출처 증명이 약해진 버전은 설치하지 않는다.
# 예외는 버전까지 지정하고 확인한 근거를 남긴다.
trustPolicy: no-downgrade
trustPolicyExclude:
  # react-query-devtools(개발 전용)의 하위 의존성. 1.9.x는 같은 관리자가 계속 수동 게시하고
  # 2.x만 서명을 도입해 약화로 판정된다. 2026-11-25 확인: 설치 스크립트 없음, OSV 취약점 0건.
  - solid-js@1.9.20

# 하위 의존성이 git이나 URL을 직접 참조하지 못하게 한다.
blockExoticSubdeps: true

# 여기서 승인하지 않은 설치 스크립트가 있으면 설치를 실패시킨다.
# false는 실행하지 않아도 동작함을 확인했다는 뜻이다. (2026-11-25 확인)
strictDepBuilds: true
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false

# --- 동작 ---------------------------------------------------------------------

engineStrict: true

# pnpm version 실행 시 커밋과 태그를 자동으로 만들지 않는다.
gitTagVersion: false

# eslint-config-next 16.4는 ESLint 10을 지원하지만, 포함된 플러그인이 아직 peer 범위를 갱신하지 않았다.
# 2026-11-25 확인: https://nextjs.org/docs/app/api-reference/config/eslint
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-import>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
    'eslint-plugin-react>eslint': '10'
